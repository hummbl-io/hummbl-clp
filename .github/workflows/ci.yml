name: hummbl-clp CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  repo-validation:
    runs-on: [self-hosted, anvil-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository baseline
        shell: powershell
        run: |
          $env:USERPROFILE = "C:\Users\Owner"
          $env:APPDATA = "C:\Users\Owner\AppData\Roaming"
          $env:LOCALAPPDATA = "C:\Users\Owner\AppData\Local"
          $python = "C:\Users\Owner\bin\python.cmd"
          & $python --version
          & $python tools\validate_repo.py

