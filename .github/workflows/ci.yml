name: hummbl-clp CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  repo-validation:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate repository baseline
        shell: python
        run: |
          import subprocess
          import sys

          subprocess.run([sys.executable, "tools/validate_repo.py"], check=True)

