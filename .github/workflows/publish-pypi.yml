name: Publish to PyPI

# Trusted Publishing (OIDC) -- no API tokens.
# Configured as a trusted publisher on pypi.org pointing to:
#   Owner: hummbl-io
#   Repository: hummbl-clp
#   Workflow: publish-pypi.yml
#   Environment: pypi

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: meta
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tag $GITHUB_REF is not an ancestor of main."
            echo "Releases must come from main. Merge your PR first, then tag the merge commit."
            exit 1
          fi
          echo "OK: tag is on main."

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify pyproject.toml version matches tag
        run: |
          pyproject_ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_ver="${{ steps.meta.outputs.version }}"
          if [ "$pyproject_ver" != "$tag_ver" ]; then
            echo "ERROR: pyproject.toml version ($pyproject_ver) != tag version ($tag_ver)"
            exit 1
          fi
          echo "OK: version matches ($pyproject_ver)"

      - name: Install test dependencies
        run: |
          pip install --upgrade pytest pytest-cov

      - name: Run unit tests
        run: python -m pytest tests/

      - name: Install build tool
        run: pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check zero runtime dependencies
        run: |
          python -c "import tomllib; deps = tomllib.load(open('pyproject.toml','rb'))['project'].get('dependencies', []); assert len(deps) == 0, f'Runtime dependencies found: {deps}'"
          echo "OK: zero runtime dependencies verified."

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI & GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write       # Create GitHub Release
      id-token: write       # OIDC for PyPI Trusted Publishing
      attestations: write  # GitHub artifact attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

      - name: Generate SHA-256 Checksums
        id: checksums
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            checksums-sha256.txt
