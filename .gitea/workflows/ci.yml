name: Gitea CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f requirements.txt ]; then
            pip install -e ".[test]" 2>/dev/null || pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
          fi
          pip install ruff mypy 2>/dev/null || true

      - name: Lint (ruff)
        run: ruff check . 2>/dev/null || true
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy . 2>/dev/null || true
        continue-on-error: true

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v --tb=short 2>/dev/null || true
          fi
        continue-on-error: true
